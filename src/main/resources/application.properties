spring.datasource.url=jdbc:h2:file:./data/ai-gateway
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

ai.request-timeout-seconds=10
ai.max-attempts=3
ai.retry-backoff-ms=500

# Add exact provider pricing explicitly before enabling cost estimation, for example:
# ai.pricing.models[0].provider=gemini
# ai.pricing.models[0].model=<configured-model-name>
# ai.pricing.models[0].input-per-million=<input-price-usd>
# ai.pricing.models[0].output-per-million=<output-price-usd>

rate-limit.requests-per-minute=10
rate-limit.window-seconds=60
